name: container-build
# A pull request runs the tests and builds the image without pushing. A push to main (a merged PR) tests, builds once
# and pushes the same image as ghcr.io/mojisejr/mumate-ebook-bot:<sha> and :<sha>-staging, so mumate-infra's staging
# follower finds it like fe and bazi (one image: this app inlines nothing at build time). Tag = the commit, never latest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-build-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: bun test test/
      - run: bunx tsc --noEmit
      - uses: docker/setup-buildx-action@v3
      - name: build
        run: docker build --build-arg GIT_SHA="$(git rev-parse HEAD)" -t ebook:ci .
      - name: login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push by SHA (and the -staging name staging-follow looks for)
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for tag in "$sha" "$sha-staging"; do
            docker tag ebook:ci "ghcr.io/mojisejr/mumate-ebook-bot:$tag"
            docker push "ghcr.io/mojisejr/mumate-ebook-bot:$tag"
          done
